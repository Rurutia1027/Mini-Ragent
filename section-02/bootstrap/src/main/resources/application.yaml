server:
  port: 9090

spring:
  application:
    name: mini-ragent
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7
  datasource:
    url: jdbc:postgresql://localhost:5432/miniragent
    username: miniragent
    password: miniragent
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

auth:
  # redis | memory
  token-store: redis
  token-ttl-seconds: 86400