server:
  port: 9090

spring:
  application:
    name: mini-ragent
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7
